<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <title>ClearFrame share image source</title>
  <style>
    @font-face {
      font-family: "DM Sans";
      font-style: normal;
      font-weight: 100 1000;
      font-display: block;
      src: url("../fonts/rP2Yp2ywxg089UriI5-g4vlH9VoD8Cmcqbu0-K4.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("../fonts/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("../fonts/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2") format("woff2");
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #101010;
      color: #efefec;
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 1200px;
      height: 630px;
      padding: 68px 80px 44px;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.035) 0.65px, transparent 0.7px) 0 0 / 8px 8px,
        #101010;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      font-weight: 650;
      font-size: 36px;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .brand svg { display: block; width: 56px; height: 56px; }
    .period { color: #6b9fff; margin-left: -8px; }
    .kicker {
      margin: 48px 0 0;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: #777773;
    }
    h1 {
      margin: 16px 0 0;
      font-weight: 500;
      font-size: 68px;
      letter-spacing: -0.055em;
      line-height: 1.05;
    }
    h1 span { color: #858581; }
    .sub {
      margin: 26px 0 0;
      max-width: 920px;
      font-size: 28px;
      line-height: 1.4;
      color: #a2a29e;
    }
    .foot {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-top: 22px;
      border-top: 1px solid #2b2b2b;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #a2a29e;
    }
    .price { color: #efefec; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#ededeb"/>
        <path d="M9 13V9h4M19 9h4v4M23 19v4h-4M13 23H9v-4" fill="none" stroke="#101010" stroke-width="2" stroke-linecap="round"/>
      </svg>
      clearframe<span class="period">.</span>
    </div>
    <p class="kicker">PHOTO METADATA CLEANER</p>
    <h1>Your photos.<br><span>Only the details you choose.</span></h1>
    <p class="sub">Scan and remove photo metadata in your browser.<br>Photos stay on your device.</p>
    <div class="foot">
      <div>JPEG · PNG · WebP · GIF · HEIC · AVIF · TIFF · RAW in Pro</div>
      <div class="price">Free · Pro $29/year</div>
    </div>
  </div>
</body>
</html>
